info:
  name: Borrar reservación
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseURL}}/booking/{{bookingid}}"
  headers:
    - name: Accept
      value: application/json
    - name: Cookie
      value: token={{token}}

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
