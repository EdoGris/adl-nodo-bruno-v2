info:
  name: Obtener reservación
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/booking/{{bookingid}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Validar consulta", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("Validación de latencia", function() {
          expect(res.getResponseTime()).to.be.lessThan(1000);
        });

        test("Validación de tipo de dato", function() {
          expect(res.getBody()).to.be.an('object');
        });

        test("Validación de headers", function() {
          expect(res.getHeader('content-type')).to.equal('application/json; charset=utf-8');
        });

        test("Objeto posea propiedades obligatorias", function() {
          const datos = res.getBody();
          expect(datos).to.have.property("firstname");
          expect(datos).to.have.property("lastname");
          expect(datos).to.have.property("totalprice");
          expect(datos).to.have.property("depositpaid");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
