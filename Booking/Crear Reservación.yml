info:
  name: Crear Reservación
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/booking"
  headers:
    - name: Content-Type
      value: application/json
      disabled: true
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstname": "Jim",
        "lastname": "Brown",
        "totalprice": 111,
        "depositpaid": true,
        "bookingdates": {
          "checkin": "2018-01-01",
          "checkout": "2019-01-01"
        },
        "additionalneeds": "Breakfast"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status==200 && res.body?.bookingid){
            bru.setEnvVar("bookingid", res.body.bookingid)
            console.log(res.body.bookingid)  
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
