info:
  name: Autenticacion
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "username" : "admin",
          "password" : "password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if(res.status==200 && res.body?.token){
            bru.setEnvVar("token", res.body.token)
            console.log(res.body.token)  
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
