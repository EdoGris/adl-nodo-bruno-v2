info:
  name: Actualizar reservación
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/booking/{{bookingid}}"
  headers:
    - name: Accept
      value: application/json
    - name: Cookie
      value: token={{token}}
  body:
    type: json
    data: |-
      {
        "additionalneeds": "Breakfast, Lunch and Dinner and... sleep"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
